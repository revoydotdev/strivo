<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Skinner — Build Status</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#0f141b; --bd:#30363d;
    --tx:#e6edf3; --dim:#8b949e;
    --green:#3fb950; --green-bg:#12341d;
    --amber:#d29922; --amber-bg:#3a2d0a;
    --red:#f85149; --red-bg:#3a1c1c; --red-dim:#7d4a4a;
    --blue:#58a6ff; --blue-bg:#0d2847;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding:18px 24px;border-bottom:1px solid var(--bd)}
  header h1{font-size:18px;margin:0;letter-spacing:.2px}
  header .sub{color:var(--dim);font-size:13px}
  .live{margin-left:auto;color:var(--dim);font-size:12px;display:flex;align-items:center;gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 var(--green);
    animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,185,80,.5)}70%{box-shadow:0 0 0 7px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
  main{padding:22px 24px;max-width:1320px;margin:0 auto}
  .section-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
  select#proj{background:var(--panel2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;
    padding:5px 10px;font-size:13px;font-weight:600;margin-left:14px;cursor:pointer;font-family:inherit}
  select#proj:hover{border-color:var(--blue)}

  /* ---- milestone arrow ---- */
  .arrow{display:flex;gap:3px;overflow-x:auto;padding-bottom:6px}
  .seg{flex:1 1 0;min-width:132px;height:70px;padding:10px 22px 10px 30px;position:relative;
    display:flex;flex-direction:column;justify-content:center;color:#fff;
    clip-path:polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%, 20px 50%)}
  .seg.first{padding-left:18px;clip-path:polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%)}
  .seg.last{min-width:150px;
    clip-path:polygon(0 0, calc(100% - 34px) 0, 100% 50%, calc(100% - 34px) 100%, 0 100%, 20px 50%)}
  .seg .mid{font-weight:700;font-size:15px}
  .seg .mtitle{font-size:11px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg .mcount{font-size:11px;opacity:.85}
  .seg.done{background:linear-gradient(180deg,#2ea043,#238636)}
  .seg.pending{background:#3a2222;color:#c9a3a3}
  .seg.active{background:linear-gradient(180deg,#e3a72a,#bb8009);color:#241a02;
    animation:glow 1.8s ease-in-out infinite}
  @keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
  .seg .badge{position:absolute;top:6px;right:34px;font-size:9px;font-weight:800;letter-spacing:.08em;
    padding:1px 6px;border-radius:10px;background:rgba(0,0,0,.35);color:#fff}
  .seg.last .badge{right:44px}
  .badge.audit{background:var(--blue);animation:glow 1.2s infinite}
  .badge.remediation{background:var(--red);animation:glow 1.2s infinite}
  .badge.building{background:rgba(0,0,0,.35)}

  /* ---- active milestone panel ---- */
  .active-wrap{background:var(--panel);border:1px solid var(--bd);border-radius:12px;
    padding:18px 20px;margin:8px 0 26px}
  .active-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .active-head h2{margin:0;font-size:16px}
  .pill{font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px}
  .pill.building{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber)}
  .pill.auditing{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue)}
  .pill.remediation{background:var(--red-bg);color:var(--red);border:1px solid var(--red)}
  .pill.pass{background:var(--green-bg);color:var(--green);border:1px solid var(--green)}
  .pill.fail{background:var(--red-bg);color:var(--red);border:1px solid var(--red)}

  .gates{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px}
  .gate{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--bd);
    background:var(--panel2);color:var(--dim);display:flex;gap:6px;align-items:center}
  .gate b{color:var(--tx)}
  .gate.pass{border-color:var(--green);color:var(--green)}
  .gate.met{border-color:var(--green);color:var(--green)}
  .gate.fail{border-color:var(--red);color:var(--red)}
  .gate.notmet,.gate.pending{border-color:var(--amber);color:var(--amber)}

  .phases{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .phase{background:var(--panel2);border:1px solid var(--bd);border-radius:10px;padding:12px 13px}
  .phase.done{border-left:3px solid var(--green)}
  .phase.active{border-left:3px solid var(--amber)}
  .phase.pending{border-left:3px solid var(--red-dim)}
  .phase h3{margin:0 0 3px;font-size:13px}
  .phase .pmeta{font-size:11px;color:var(--dim);margin-bottom:9px}
  .stage{margin:9px 0}
  .stage .sname{font-size:12px;color:var(--tx);margin-bottom:5px;display:flex;gap:7px;align-items:center}
  .sdot{width:8px;height:8px;border-radius:2px;flex:none}
  .sdot.done{background:var(--green)} .sdot.active{background:var(--amber)} .sdot.pending{background:var(--red-dim)}
  .todos{display:flex;flex-wrap:wrap;gap:5px}
  .todo{font-size:10.5px;padding:2px 7px;border-radius:5px;border:1px solid var(--bd);
    background:#0b0f14;color:var(--dim);cursor:default}
  .todo.done{border-color:var(--green);color:var(--green);background:var(--green-bg)}
  .todo.pending{border-color:var(--red-dim);color:#c99}

  /* ---- commits ---- */
  .commits{background:var(--panel);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
  .commit{display:flex;gap:12px;align-items:baseline;padding:8px 16px;border-bottom:1px solid var(--bd);
    border-left:3px solid var(--bd)}
  .commit:last-child{border-bottom:none}
  .commit.feat{border-left-color:var(--green)} .commit.fix{border-left-color:var(--amber)}
  .commit.chore{border-left-color:var(--dim)} .commit.docs{border-left-color:var(--blue)}
  .commit.test{border-left-color:#a371f7} .commit.other{border-left-color:var(--bd)}
  .commit .h{color:var(--amber);flex:none}
  .commit .s{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .commit .r{color:var(--dim);font-size:12px;flex:none}
  .err{color:var(--red);padding:20px}

  /* ---- now / live activity ---- */
  .now{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;margin:8px 0 26px}
  .now-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .now-status{font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px}
  .beacon{width:11px;height:11px;border-radius:50%;flex:none;background:var(--dim)}
  .beacon.on{background:var(--green);animation:pulse 1.4s infinite}
  .beacon.audit{background:var(--blue);animation:pulse 1.4s infinite}
  .beacon.remediation{background:var(--red);animation:pulse 1.4s infinite}
  .now-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:820px){.now-grid{grid-template-columns:1fr}}
  .now-col h4,.logbox h4{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .working{display:flex;flex-wrap:wrap;gap:8px}
  .wchip{display:flex;align-items:center;gap:8px;background:var(--amber-bg);color:var(--amber);
    border:1px solid var(--amber);border-radius:20px;padding:4px 13px;font-size:12.5px;font-weight:600}
  .wchip .b{width:7px;height:7px;border-radius:50%;background:var(--amber);animation:pulse 1.2s infinite}
  .idle-note{color:var(--dim);font-size:13px}
  .dlist{display:flex;flex-direction:column;gap:6px}
  .drow{display:flex;gap:10px;align-items:baseline;font-size:12.5px}
  .drow .t{color:var(--green);flex:none;font-weight:600}
  .drow .c{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .drow .rt{margin-left:auto;color:var(--dim);font-size:11px;flex:none}
  .logbox{margin-top:16px}
  .logbox pre{background:#080b10;border:1px solid var(--bd);border-radius:8px;padding:11px 13px;
    max-height:190px;overflow:auto;font-size:11.5px;line-height:1.55;color:#9db2c9;white-space:pre-wrap;
    word-break:break-word;margin:0}
</style>
</head>
<body>
<header>
  <h1>🐾 <span id="title">Swarm</span></h1>
  <select id="proj" title="switch project"></select>
  <span class="sub" id="sub">loading…</span>
  <span class="live"><span class="dot" id="dot"></span><span id="upd"></span></span>
</header>
<main>
  <p class="section-label">Milestones — path to 1.0.0</p>
  <div class="arrow" id="arrow"></div>

  <p class="section-label" style="margin-top:24px">Now — live activity</p>
  <div id="now"></div>

  <p class="section-label">Active milestone</p>
  <div id="active"></div>

  <p class="section-label">Recent commits</p>
  <div class="commits" id="commits"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtAge(s){ if(s==null) return ''; if(s<60) return s+'s'; if(s<3600) return Math.round(s/60)+'m'; return (s/3600).toFixed(1)+'h'; }
function reltime(ts){ if(!ts) return ''; const d=(Date.now()-new Date(ts).getTime())/1000;
  if(d<60) return Math.max(0,Math.round(d))+'s ago'; if(d<3600) return Math.round(d/60)+'m ago';
  if(d<86400) return Math.round(d/3600)+'h ago'; return Math.round(d/86400)+'d ago'; }

function renderArrow(st){
  const n = st.milestones.length;
  $('arrow').innerHTML = st.milestones.map((m,i) => {
    const cls = [ 'seg', m.status, i===0?'first':'', m.is_last?'last':'' ].filter(Boolean).join(' ');
    let badge = '';
    if (m.status === 'active'){
      const pd = st.phase_detail;
      badge = `<span class="badge ${pd}">${esc(pd.toUpperCase())}</span>`;
    }
    const count = m.todos_total ? `${m.todos_done}/${m.todos_total}` : (m.status==='pending'?'—':'');
    return `<div class="${cls}" title="${esc(m.title)}">
      ${badge}
      <span class="mid">${m.id}</span>
      <span class="mtitle">${esc(m.title)}</span>
      <span class="mcount">${count}</span>
    </div>`;
  }).join('');
}

function renderActive(st){
  const a = st.active;
  if (!a){ $('active').innerHTML = '<div class="err">No active milestone.</div>'; return; }
  const pd = a.phase_detail;
  let audit = '';
  if (st.last_audit && st.last_audit.milestone === a.id){
    const v = st.last_audit.verdict.toLowerCase();
    audit = `<span class="pill ${v}">AUDIT ${esc(st.last_audit.verdict)}</span>`;
  }
  const gates = (a.gates||[]).map(g => {
    const cls = g.status.toLowerCase().replace(/\s+/g,'');
    return `<span class="gate ${cls}" title="${esc(g.desc)}"><b>${g.id}</b>${esc(g.status)}</span>`;
  }).join('');
  const phases = (a.phases||[]).map(ph => {
    const stages = ph.stages.map(s => {
      const todos = s.todos.map(t =>
        `<span class="todo ${t.done?'done':'pending'}" title="${esc(t.desc)}">${t.id.split('.').slice(2).join('.')}</span>`
      ).join('');
      const nm = s.title ? `${s.id} · ${esc(s.title)}` : s.id;
      return `<div class="stage"><div class="sname"><span class="sdot ${s.status}"></span>${nm}
        <span style="color:var(--dim)">${s.done}/${s.total}</span></div>
        <div class="todos">${todos||'<span class="todo">no todos yet</span>'}</div></div>`;
    }).join('');
    return `<div class="phase ${ph.status}"><h3>${ph.id}${ph.title?' · '+esc(ph.title):''}</h3>
      <div class="pmeta">${ph.done}/${ph.total} todos</div>${stages}</div>`;
  }).join('');
  $('active').innerHTML = `<div class="active-wrap">
    <div class="active-head"><h2>${a.id} — ${esc(a.title)}</h2>
      <span class="pill ${pd}">${esc(pd.toUpperCase())}</span>${audit}</div>
    ${gates?`<div class="gates">${gates}</div>`:''}
    <div class="phases">${phases}</div></div>`;
}

function renderCommits(st){
  $('commits').innerHTML = (st.commits||[]).map(c =>
    `<div class="commit ${c.type}"><span class="h mono">${esc(c.hash)}</span>
     <span class="s">${esc(c.subject)}</span><span class="r">${esc(c.rel)}</span></div>`
  ).join('') || '<div class="err">no commits</div>';
}

function renderLive(st){
  const L = st.live||{}, tk = L.tick||{};
  const active = !!tk.active, pd = st.phase_detail;
  const bcls = !active ? 'off' : (st.phase==='AUDIT'?'audit':st.phase==='REMEDIATION'?'remediation':'on');
  const status = active
    ? `${esc(pd.toUpperCase())} · tick running ${fmtAge(tk.age_s)}`
    : `IDLE · between ticks`;
  const working = (L.working&&L.working.length)
    ? L.working.map(c=>`<span class="wchip"><span class="b"></span>${esc(c)}</span>`).join('')
    : '<span class="idle-note">no workers active right now</span>';
  const done = (L.recent_done&&L.recent_done.length)
    ? '<div class="dlist">'+L.recent_done.map(d=>
        `<div class="drow"><span class="t mono">${esc(d.todo)}</span>
          <span class="c">${esc(d.concern)}</span>
          <span class="rt">${esc(reltime(d.ts))}</span></div>`).join('')+'</div>'
    : '<span class="idle-note">no live-verified todos yet</span>';
  const log = (L.log_tail||[]).map(esc).join('\n') || '(no log yet)';
  $('now').innerHTML = `<div class="now">
    <div class="now-head"><span class="now-status"><span class="beacon ${bcls}"></span>${status}</span></div>
    <div class="now-grid">
      <div class="now-col"><h4>Building now — worktrees</h4><div class="working">${working}</div></div>
      <div class="now-col"><h4>Just verified ✓</h4>${done}</div>
    </div>
    <div class="logbox"><h4>Live tick log</h4><pre id="logpre">${log}</pre></div>
  </div>`;
  const lp = $('logpre'); if(lp) lp.scrollTop = lp.scrollHeight;
}

let SEL = null;  // selected project id (null → server default)
async function loadProjects(){
  try{
    const ps = await (await fetch('/api/projects',{cache:'no-store'})).json();
    const sel = $('proj');
    if(ps.length <= 1){ sel.style.display='none'; }
    const dot = {active:'🟢', validated:'🟡', candidate:'⚪', holding:'🟠', paused:'🔴', done:'✅'};
    sel.innerHTML = ps.map(p => `<option value="${esc(p.id)}"${p.id===SEL?' selected':''}>${dot[p.status]||'•'} ${esc(p.id)} · ${esc(p.phase)} ${esc(p.milestone)} [${esc(p.workflow)}]</option>`).join('');
    if(!SEL && ps.length){ SEL = ps[0].id; }
  }catch(e){ /* single-project fallback: no dropdown */ }
}
$('proj').addEventListener('change', e => { SEL = e.target.value; refresh(); });

async function refresh(){
  try{
    const url = '/api/state' + (SEL ? ('?project='+encodeURIComponent(SEL)) : '');
    const st = await (await fetch(url,{cache:'no-store'})).json();
    const tk = (st.live&&st.live.tick)||{};
    $('title').textContent = st.project || 'Swarm';
    $('sub').textContent = `${st.current_milestone} of ${st.totals.milestones} · ${st.phase_detail}${tk.active?' (tick running)':''} · ${st.totals.done} todos done · ${st.project_status||''}`;
    $('upd').textContent = 'updated ' + new Date().toLocaleTimeString();
    $('dot').style.background = st.phase==='REMEDIATION' ? 'var(--red)' : (st.phase==='AUDIT'?'var(--blue)':'var(--green)');
    renderArrow(st); renderLive(st); renderActive(st); renderCommits(st);
  }catch(e){
    $('sub').textContent = 'fetch error: ' + e.message;
    $('dot').style.background = 'var(--red)';
  }
}
(async () => { await loadProjects(); await refresh(); setInterval(async () => { await loadProjects(); await refresh(); }, 5000); })();
</script>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Cross-check the Windows target from Linux. Required as of the port landing:
  # it is what stops a Unix-only API sneaking back into the daemon or recorder.
  #
  # GNU target, not MSVC: it needs only mingw-w64, which the runner already has,
  # and it catches the cfg-gated API errors that make up the bulk of the port.
  # It does NOT catch MSVC linking — the release artifacts are MSVC, so a real
  # build on win11-ci remains the gate.
  windows-cross:
    name: windows cross-check
    # Public fork PRs must never execute on local infrastructure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, arch]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scratch on disk, not tmpfs
        # The self-hosted Arch runner's /tmp is a quota-limited tmpfs shared
        # with everything else on the host; cc/rustc temp files there have
        # failed with "Disk quota exceeded". $RUNNER_TEMP is on real disk.
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: Cross-check
        run: ./scripts/check-windows.sh

  # The declared MSRV is a promise the manifests make to anyone building from
  # source; without a job that actually holds a compiler to it, it silently
  # drifts as dependencies raise their own floors. Reads the version out of
  # Cargo.toml rather than repeating it, so the check can never disagree with
  # what the manifests claim.
  msrv:
    name: msrv
    # Public fork PRs must never execute on local infrastructure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, arch]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scratch on disk, not tmpfs
        # The self-hosted Arch runner's /tmp is a quota-limited tmpfs shared
        # with everything else on the host; cc/rustc temp files there have
        # failed with "Disk quota exceeded". $RUNNER_TEMP is on real disk.
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Resolve declared MSRV
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "Declared MSRV: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Toolchain
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal

      # --all-features so the Creator crates' dependency floors count too,
      # and --locked so this checks the committed graph rather than whatever
      # resolves fresh today.
      - name: check (workspace, all features)
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-features --locked

  # Packaging/doc-contract lints -- fast, no Rust toolchain needed. Each
  # check is a standalone script under scripts/ so it can also be run
  # locally ahead of a PR.
  packaging-docs:
    name: packaging & docs lints
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, arch]
    timeout-minutes: 10
    steps:
      # Full history (not the default shallow clone) -- the CHANGELOG check
      # below needs `git describe --tags` / `git log <tag>..HEAD` to work.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: NOTICE.md matches vendored-deps.toml
        run: scripts/check-notice.sh

      - name: config.toml.example covers every AppConfig field
        run: scripts/check-config-example.sh

      - name: AUR .SRCINFO matches PKGBUILD
        run: scripts/check-srcinfo.sh

      - name: documented CLI subcommands exist
        run: scripts/check-cli-subcommands.sh

      - name: CHANGELOG Unreleased is non-empty when feat/fix commits exist
        run: scripts/check-changelog-unreleased.sh

  check:
    name: fmt + clippy + test
    # Public fork PRs must never execute on local infrastructure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, arch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scratch on disk, not tmpfs
        # The self-hosted Arch runner's /tmp is a quota-limited tmpfs shared
        # with everything else on the host; cc/rustc temp files there have
        # failed with "Disk quota exceeded". $RUNNER_TEMP is on real disk.
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup default stable
          rustup component add rustfmt clippy

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # --workspace builds with the `creator` feature OFF, so the feature-gated
      # code in core/web/bin is never linted above. Lint it explicitly.
      - name: clippy (Creator Edition)
        run: cargo clippy -p strivo-core -p strivo-web -p strivo-bin --features creator --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --release --all-targets --locked

      # Some behaviour only exists in a debug build — most notably the
      # `STRIVO_DEV_UNLOCK_ALL` entitlement override, which `licence::gate`
      # compiles out of release. Tests covering those paths are
      # `cfg(debug_assertions)`-gated and would never run in the release
      # step above, so run the suite once more unoptimised.
      - name: test (debug — covers debug-only paths)
        run: cargo test --workspace --all-targets --locked

      - name: build (PVR — default edition)
        run: cargo build --release --locked --message-format=json > target/pvr-build.json

      # The Creator build below writes the same `target/release/strivo` path.
      # Keep the PVR executable separately so the real-server lane actually
      # exercises the edition it is meant to guard.
      - name: preserve PVR binary for real-server e2e
        run: |
          mkdir -p target/pvr-release
          cp target/release/strivo target/pvr-release/strivo
          python3 - <<'PY'
          import json, pathlib, shutil
          records = [json.loads(line) for line in pathlib.Path("target/pvr-build.json").read_text().splitlines()]
          outputs = {pathlib.Path(r["out_dir"]) / "assets" for r in records
                     if r.get("reason") == "build-script-executed"
                     and pathlib.Path(r["out_dir"]).parent.name.startswith("strivo-web-")}
          assert len(outputs) == 1, f"expected one PVR web asset output, got {outputs}"
          shutil.copytree(outputs.pop(), "target/pvr-release/assets", dirs_exist_ok=True)
          PY

      # The default build/test above is the pure PVR (workspace default-members).
      # These steps exercise the Creator Edition feature-gated code paths in
      # strivo-core/strivo-web/strivo-bin, which the default build never compiles.
      - name: build (Creator Edition)
        run: cargo build --release -p strivo-bin --features creator --locked

      - name: test (Creator Edition)
        run: cargo test --release -p strivo-web -p strivo-bin --features creator --all-targets --locked

      # The Creator-only entitlement override deliberately exists only in
      # debug builds. Its happy paths need a Creator-featured debug suite;
      # the workspace debug suite above keeps the default PVR feature set.
      - name: test (Creator Edition, debug)
        run: cargo test -p strivo-web -p strivo-bin --features creator --all-targets --locked

      # Pin Node so the job does not inherit whatever npm this rolling-release
      # self-hosted runner happens to have. An npm change on the box broke the
      # `npm ci` steps below on 2026-07-29 without any repo change.
      - name: Node toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Licence backend typecheck + tests
        working-directory: licence-backend
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Web UI browser smoke tests
        working-directory: crates/strivo-web/e2e
        run: |
          npm ci
          npx playwright install chromium
          npm test

      - name: Web UI performance regressions (PVR release assets)
        working-directory: crates/strivo-web/e2e
        env:
          STRIVO_E2E_ASSETS_DIR: ${{ github.workspace }}/target/pvr-release/assets
        run: npm run test:performance

      # S04 — the lane above drives the SPA against mock-server.mjs (a Node
      # stub), which proves nothing about the real strivo-web binary or its
      # auth wiring. This lane boots the actual compiled server (daemon +
      # web, sandboxed under a throwaway $HOME by real-server.sh so it can't
      # collide with a real installation) and drives a real login ->
      # recordings round-trip plus an unauthenticated-request check over an
      # actual HTTP socket. Needs the PVR-edition release binary built above.
      - name: Web UI real-server e2e
        working-directory: crates/strivo-web/e2e
        env:
          STRIVO_BIN: ${{ github.workspace }}/target/pvr-release/strivo
        run: npm run test:real

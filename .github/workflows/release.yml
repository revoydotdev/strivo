name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Rehearsal trigger. A tag push is a one-way door -- it was the only way to
  # exercise this workflow, which is why v0.4.0 and v0.5.0 both failed in ways
  # nobody could see beforehand. A dispatch run builds and uploads artifacts but
  # never publishes a release, so the pipeline can be proven before tagging.
  workflow_dispatch:
    inputs:
      linux:
        description: "Build the x86_64-linux tarball"
        type: boolean
        default: true
      macos:
        description: "Build the x86_64-macOS tarball (needs the macos-sonoma runner online)"
        type: boolean
        default: false
      windows:
        description: "Build the x86_64-windows zip (needs the win11-ci runner online)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fails fast, before any platform build starts, when the pushed tag
  # disagrees with Cargo.toml's [workspace.package] version -- catching the
  # class of drift that used to only surface after three platform builds
  # had already run.
  check-version:
    name: Tag matches manifest version
    runs-on: [self-hosted, linux, x64, arch]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-release-version.sh

  build-linux:
    name: Build x86_64-linux tarball
    needs: check-version
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: [self-hosted, linux, x64, arch]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scratch on disk, not tmpfs
        # The self-hosted Arch runner's /tmp is a quota-limited tmpfs shared
        # with everything else on the host; cc/rustc temp files there have
        # failed with "Disk quota exceeded". $RUNNER_TEMP is on real disk.
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Toolchain
        run: rustup show active-toolchain || rustup default stable

      - name: Build release
        run: cargo build --release --locked

      - name: Generate completions + manpage
        run: |
          mkdir -p dist/completions dist/man
          ./target/release/strivo completions bash > dist/completions/strivo.bash
          ./target/release/strivo completions zsh  > dist/completions/_strivo
          ./target/release/strivo completions fish > dist/completions/strivo.fish
          ./target/release/strivo man > dist/man/strivo.1

      - name: Stage tarball
        id: stage
        run: |
          # On a tag push the ref is the version; on a rehearsal dispatch the ref
          # is a branch name, so fall back to the crate version and mark it -dev
          # so a rehearsal artifact can never be mistaken for a release.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-dev"
          fi
          PKG="strivo-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${PKG}"
          cp target/release/strivo                  "dist/${PKG}/"
          cp README.md LICENSE CHANGELOG.md         "dist/${PKG}/"
          cp -r dist/completions                    "dist/${PKG}/"
          cp -r dist/man                            "dist/${PKG}/"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          (cd dist && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256")
          echo "pkg=${PKG}" >> "$GITHUB_OUTPUT"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-tarball
          path: |
            dist/${{ steps.stage.outputs.pkg }}.tar.gz
            dist/${{ steps.stage.outputs.pkg }}.tar.gz.sha256

      # mpv stays a host dependency on Linux for now (no verified static
      # build exists) -- see packaging/vendored-deps.toml.
      - name: Build AppImage (ffmpeg/streamlink/yt-dlp bundled)
        run: |
          mkdir -p dist/appimage
          packaging/linux/build-appimage.sh target/release/strivo dist/appimage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-appimage
          path: |
            dist/appimage/*.AppImage
            dist/appimage/*.AppImage.sha256

  build-macos:
    name: Build x86_64-apple-darwin tarball
    needs: check-version
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    runs-on: [self-hosted, macos, x64, sonoma]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: rustup show active-toolchain || rustup default stable

      - name: Build release
        run: cargo build --release --locked

      - name: Generate completions + manpage
        run: |
          mkdir -p dist/completions dist/man
          ./target/release/strivo completions bash > dist/completions/strivo.bash
          ./target/release/strivo completions zsh  > dist/completions/_strivo
          ./target/release/strivo completions fish > dist/completions/strivo.fish
          ./target/release/strivo man > dist/man/strivo.1

      - name: Stage tarball
        id: stage
        run: |
          # On a tag push the ref is the version; on a rehearsal dispatch the ref
          # is a branch name, so fall back to the crate version and mark it -dev
          # so a rehearsal artifact can never be mistaken for a release.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-dev"
          fi
          PKG="strivo-${VERSION}-x86_64-apple-darwin"
          mkdir -p "dist/${PKG}"
          cp target/release/strivo                  "dist/${PKG}/"
          cp README.md LICENSE CHANGELOG.md         "dist/${PKG}/"
          cp -r dist/completions                    "dist/${PKG}/"
          cp -r dist/man                            "dist/${PKG}/"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          (cd dist && shasum -a 256 "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256")
          echo "pkg=${PKG}" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-tarball
          path: |
            dist/${{ steps.stage.outputs.pkg }}.tar.gz
            dist/${{ steps.stage.outputs.pkg }}.tar.gz.sha256

  build-windows:
    name: Build x86_64-windows-msvc zip
    needs: check-version
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        shell: powershell
        run: rustup show active-toolchain; if (!$?) { rustup default stable }

      - name: Build release
        shell: powershell
        env:
          FFMPEG_DIR: C:\ffmpeg-win64
        run: cargo build --release --locked

      - name: Generate completions
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist\completions | Out-Null
          .\target\release\strivo.exe completions powershell > dist\completions\strivo.ps1

      - name: Stage zip
        id: stage
        shell: powershell
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $VERSION = $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            $VERSION = ((Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value) + '-dev'
          }
          $PKG = "strivo-$VERSION-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path "dist\$PKG" | Out-Null
          Copy-Item target\release\strivo.exe              "dist\$PKG\"
          Copy-Item README.md, LICENSE, CHANGELOG.md       "dist\$PKG\"
          Copy-Item dist\completions                       "dist\$PKG\completions" -Recurse
          Compress-Archive -Path "dist\$PKG" -DestinationPath "dist\$PKG.zip"
          $hash = (Get-FileHash "dist\$PKG.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $PKG.zip" | Out-File "dist\$PKG.zip.sha256" -Encoding ASCII
          "pkg=$PKG" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-zip
          path: |
            dist/${{ steps.stage.outputs.pkg }}.zip
            dist/${{ steps.stage.outputs.pkg }}.zip.sha256

      # Bundles ffmpeg/mpv/streamlink/yt-dlp per packaging/vendored-deps.toml
      # into a step-through Inno Setup wizard -- see
      # docs/adr/0003-installer-packaging-and-bundled-dependencies.md. Kept
      # alongside the raw zip above, not replacing it: the zip stays useful
      # for a portable/no-install run, matching the Linux job's
      # tarball-plus-AppImage shape.
      - name: Build Windows installer
        shell: powershell
        run: packaging\windows\build-installer.ps1

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: |
            dist/windows-installer/*.exe
            dist/windows-installer/*.exe.sha256

  publish:
    name: Publish GitHub release
    needs: [build-linux, build-macos, build-windows]
    # Never publish from a rehearsal run, and never publish a partial set: if any
    # platform failed or was skipped on a tag push, stop and let a human decide.
    if: github.event_name == 'push' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'skipped')
    runs-on: [self-hosted, linux, x64, arch]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/linux-tarball/*
            dist/linux-appimage/*
            dist/macos-tarball/*
            dist/windows-zip/*
            dist/windows-installer/*
          generate_release_notes: true
          body: |
            # strivo ${{ github.ref_name }}

            Alpha release. See [CHANGELOG.md](https://github.com/revoydotdev/strivo/blob/main/CHANGELOG.md)
            for the human-curated release notes and [ROADMAP.md](https://github.com/revoydotdev/strivo/blob/main/ROADMAP.md)
            for what is shipped versus planned.

            The attached builds are the released live-stream PVR edition. Creator Edition work is
            experimental and unavailable in this release: no Creator binary, container, activation,
            or purchase path is published.

            Platform artifacts are listed under **Assets** below. Each carries its own
            `.sha256` manifest — verify with `sha256sum -c` (Linux/macOS) or `Get-FileHash` (Windows).

[package]
name = "strivo-chat-density"
version = "0.3.0"
edition = "2021"
description = "Audience-retention proxy from Twitch chat density — DAW-vision iter 19"
authors = ["revelri <slrevoy@mailbox.org>"]
license = "MIT"
publish = false
rust-version = "1.88"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# The canonical time model. Same edition boundary as this crate: both are
# optional dependencies of strivo-web that only `creator` activates.
strivo-editor = { path = "../editor" }

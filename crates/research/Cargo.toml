[package]
name = "strivo-research"
version = "0.1.0"
edition = "2021"
description = "Canonical qualitative-research and multimodal signal store for Strivo Pro"
authors = ["revelri <slrevoy@mailbox.org>"]
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
sha2 = "0.10"
# The canonical time model: integer microseconds, the interval map and the
# clock map. Same edition boundary as this crate — both are optional
# dependencies of strivo-web that only the `creator` feature activates, so a
# PVR build compiles neither.
strivo-editor = { path = "../editor" }
# OBS track roles: the one place that answers "which mic/game/voice-chat/
# music/mixed track is this". Reused rather than reimplemented, because two
# substring tables over a track name would be two answers to one question.
strivo-multitrack = { path = "../multitrack" }

[dev-dependencies]
tempfile = "3"

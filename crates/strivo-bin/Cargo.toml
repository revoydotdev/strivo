[package]
name = "strivo-bin"
version = "0.5.0"
edition = "2021"
description = "StriVo — self-hosted live-stream PVR, CLI + daemon binary"
authors = ["revelri <slrevoy@mailbox.org>"]
license = "MIT"
repository = "https://github.com/revoydotdev/strivo"
homepage = "https://github.com/revoydotdev/strivo"
readme = "../../README.md"
keywords = ["pvr", "twitch", "youtube", "streaming", "recording"]
categories = ["command-line-utilities", "multimedia"]
publish = false
rust-version = "1.75"

[[bin]]
name = "strivo"
path = "src/main.rs"

[features]
# Creator Edition build. Registers the first-party plugins (Crunchr, Archiver,
# Insights, Editor, Viewguard) into the daemon and turns on the creator web
# routes + core config surface. The default `cargo build` is a pure Live Stream
# PVR: `cargo build -p strivo-bin --features creator` builds the full edition.
creator = ["dep:strivo-plugins", "strivo-web/creator", "strivo-core/creator"]

[dependencies]
strivo-core = { path = "../.." }
strivo-plugins = { path = "../strivo-plugins", optional = true }
strivo-web = { path = "../strivo-web" }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
which = "8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
toml = "0.9"

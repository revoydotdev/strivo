[package]
name = "strivo-bin"
version.workspace = true
edition = "2021"
description = "StriVo — self-hosted live-stream PVR, CLI + daemon binary"
authors = ["revelri <slrevoy@mailbox.org>"]
license = "MIT"
repository = "https://github.com/revoydotdev/strivo"
homepage = "https://github.com/revoydotdev/strivo"
readme = "../../README.md"
keywords = ["pvr", "twitch", "youtube", "streaming", "recording"]
categories = ["command-line-utilities", "multimedia"]
publish = false
rust-version = "1.88"

[[bin]]
name = "strivo"
path = "src/main.rs"

[features]
# Creator Edition build. Registers the first-party plugins (Crunchr, Archiver,
# Insights, Editor, Viewguard) into the daemon and turns on the creator web
# routes + core config surface. The default `cargo build` is a pure Live Stream
# PVR: `cargo build -p strivo-bin --features creator` builds the full edition.
creator = ["dep:strivo-plugins", "strivo-web/creator"]

[dependencies]
strivo-core = { path = "../.." }
strivo-plugins = { path = "../strivo-plugins", optional = true }
strivo-web = { path = "../strivo-web" }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
which = "8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
toml = "0.9"

[target.'cfg(windows)'.build-dependencies]
# Embeds strivo.exe's icon + version-info resource. Actively maintained
# (unlike the older `winres`, last released 2021). Build-dependency target
# selectors key off the HOST platform (build scripts always compile for the
# host, never the crate's --target), which is why build.rs also gates the
# code that references this crate with a host-matching #[cfg(windows)],
# not the target-aware cfg!(target_os = ...) macro -- see build.rs's own
# comment for what that means for cross-compiled checks.
embed-resource = "3.0"

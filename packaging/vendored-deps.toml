Portable zip, not the NSIS installer (same release, simpler/safer to
extract — plain Expand-Archive, no NSIS-specific 7z quirks). Contains
`bin/streamlink.exe`, which is NOT self-contained: verified via `strings`
that it's a shebang-style stub (`#!<launcher_dir>\\..\\Python\\python.exe`)
requiring its sibling `Python/` and `pkgs/` directories one level up from
`bin/`. Bundle all three (bin/streamlink.exe, Python/, pkgs/) preserving
that relative layout — do NOT extract streamlink.exe alone, it will fail
to find its interpreter. Also contains its own `ffmpeg/` folder; skip it,
StriVo vendors ffmpeg separately via BtbN so there is one ffmpeg
build/license per install, not two.
"""


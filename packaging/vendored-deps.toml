# Pinned upstream binaries bundled into StriVo's Linux/Windows/macOS
# installers. See docs/adr/0003-installer-packaging-and-bundled-dependencies.md
# for the licensing rationale (mere aggregation — each tool keeps its own
# license, unaffected by StriVo's MIT license) and docs/PACKAGING-PLAN.md
# for how this file is consumed by CI.
#
# Every row was verified against the upstream release's own GitHub-computed
# sha256 digest (`gh api repos/<owner>/<repo>/releases/tags/<tag>`), not
# hand-computed — re-verify the same way when bumping a pin.
#
# `license` here is the license of the SPECIFIC BINARY ARTIFACT being
# bundled, which is not always the project's overall source license (see
# the ADR: yt-dlp's source is Unlicense, but its PyInstaller standalone
# executables embed GPLv3+ code; mpv's source supports an LGPL build mode,
# but that mode is not recommended for the CLI player StriVo actually
# spawns, so the CLI binary here is GPL).
#
# `status = "unresolved"` rows have no verified official static/standalone
# binary source yet. Do not fill these in with an unofficial or unverified
# third-party build without a deliberate decision — see docs/PACKAGING-PLAN.md
# "Open decisions".

[ffmpeg]
# BtbN/FFmpeg-Builds' `latest` tag is a rolling release, rebuilt on every
# commit — its contents (and therefore its checksum) change over time even
# though the URL doesn't. Pin to a dated `autobuild-YYYY-MM-DD-HH-MM` tag
# instead, which is an immutable snapshot, and re-pin deliberately.
#
# BtbN prunes dated autobuilds after about a month, so the ffmpeg pins resolve
# through StriVo's own `vendored-deps-YYYY-MM-DD` mirror release (`url`), with
# the BtbN original kept in `upstream_url`. Re-pinning means uploading a new
# mirror release first, then updating `url`, `sha256` and `version`.

